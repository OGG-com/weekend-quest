<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff8f4">
<title>Weekend results ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap');
:root{--ink:#59372f;--muted:#98776d;--rose:#df8d91;--cream:#fff8f3;--line:#f1dcd5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream)}body{min-height:100svh;display:grid;place-items:center;padding:18px 14px;color:var(--ink);font-family:Nunito,system-ui,sans-serif;background:radial-gradient(ellipse at 10% 5%,#ffe9e3 0,transparent 35%),radial-gradient(ellipse at 95% 90%,#f9e6d5 0,transparent 36%),#fff8f3}.wrap{width:min(100%,430px)}.card{padding:clamp(24px,6vw,34px);background:rgba(255,255,255,.8);border:1px solid #f4e3dd;border-radius:28px;box-shadow:0 14px 40px #9c665012}.heart{text-align:center;color:#e68d91;font-size:27px;margin-bottom:10px}h1{margin:0;text-align:center;font:700 clamp(28px,7vw,36px)/1.15 Quicksand,Nunito,sans-serif;letter-spacing:-.04em}.intro{text-align:center;color:#9b7b70;font-size:14px;line-height:1.5;margin:10px auto 22px}.field{display:block;width:100%;height:48px;border:1.5px solid var(--line);border-radius:15px;background:#fffdfb;padding:0 14px;font:600 15px Nunito,sans-serif;color:var(--ink);outline-color:#d98288}.btn{display:block;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:15px;background:linear-gradient(135deg,#d98288,#c86e7a);color:white;font:700 15px Quicksand,Nunito,sans-serif;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.status{min-height:20px;margin-top:10px;text-align:center;color:#a25e65;font-size:13px;font-weight:700}.hidden{display:none!important}.stats{margin-top:20px}.total{text-align:center;background:#fff1ee;border-radius:18px;padding:16px;margin-bottom:14px}.total strong{display:block;font:700 34px Quicksand,sans-serif}.total span{color:#9b7b70;font-size:13px}.item{padding:14px;border:1px solid var(--line);border-radius:17px;background:#fffdfb;margin-top:10px}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800}.percent{color:#a66b6b;font:700 15px Quicksand,sans-serif}.track{height:9px;background:#f7e8e4;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:linear-gradient(90deg,#e6a0a0,#cb777d);border-radius:99px;transition:width .35s}.item:nth-of-type(2) .bar{background:linear-gradient(90deg,#f2cda0,#dfab73)}.back{display:block;text-align:center;margin-top:18px;color:#a36d68;text-decoration:none;font-size:13px;font-weight:800}.foot{text-align:center;color:#b18d82;font-size:12px;font-style:italic;margin:16px 0 0}
</style></head><body><main class="wrap"><section class="card"><div class="heart">♥</div><h1>Weekend results</h1><p class="intro">A little private peek at the votes. ♡</p>
<div class="status" id="status" role="status" aria-live="polite"></div>
<section class="stats hidden" id="stats"><div class="total"><strong id="total">0</strong><span>total votes ♡</span></div><div class="item"><div class="itemhead"><span>💗 Ja, la oss møtes!</span><span class="percent" id="meetText">0 · 0%</span></div><div class="track"><div class="bar" id="meetBar"></div></div></div><div class="item"><div class="itemhead"><span>🌙 Ikke denne helgen</span><span class="percent" id="restText">0 · 0%</span></div><div class="track"><div class="bar" id="restBar"></div></div></div><button class="btn" id="refresh" type="button">Refresh results ↻</button></section>
<a class="back" href="./">← Back to the poll</a><p class="foot">Only the totals are shown here. ♡</p></section></main>
<script>
const CONFIG={supabaseUrl:'https://ghtzhnjmgsrqxnocvuwn.supabase.co',supabaseAnonKey:'sb_publishable_-V7bEzUED52q-lumtLL67w_IzzwlLzv'};
const status=document.getElementById('status'),refresh=document.getElementById('refresh'),stats=document.getElementById('stats');
async function loadResults(){refresh.disabled=true;status.textContent='Loading results…';try{const r=await fetch(CONFIG.supabaseUrl+'/rest/v1/rpc/get_weekend_vote_results',{method:'POST',headers:{'apikey':CONFIG.supabaseAnonKey,'Authorization':'Bearer '+CONFIG.supabaseAnonKey,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Could not load results');const d=await r.json();const total=Number(d.total)||0,meet=Number(d.meet)||0,rest=Number(d.rest)||0;document.getElementById('total').textContent=total;document.getElementById('meetText').textContent=`${meet} · ${total?Math.round(meet/total*100):0}%`;document.getElementById('restText').textContent=`${rest} · ${total?Math.round(rest/total*100):0}%`;document.getElementById('meetBar').style.width=(total?meet/total*100:0)+'%';document.getElementById('restBar').style.width=(total?rest/total*100:0)+'%';stats.classList.remove('hidden');status.textContent='';}catch(e){status.textContent='Could not load results yet. Check that the Supabase setup has been run.';stats.classList.add('hidden');}finally{refresh.disabled=false;}}
document.getElementById('refresh').addEventListener('click',loadResults);loadResults();
</script></body></html>
